name: Logging PR review

on:
  push:
    branches: [codex/validate-logging-prs]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        revision: [pull_request_fix_bug, pr_append_partial]
        compiler: [g++, clang++]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/validate-logging-prs
          path: harness
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision }}
          path: source
          fetch-depth: 0
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libboost-dev libboost-test-dev libboost-system-dev libboost-program-options-dev
      - name: Configure
        working-directory: source
        run: |
          git log -1 --format=fuller
          ${{ matrix.compiler }} --version
          cmake --version
          flags=()
          if [ '${{ matrix.build_type }}' = Debug ]; then
            flags+=('-DCMAKE_CXX_FLAGS_DEBUG=-O0 -fsanitize=address,undefined -fno-omit-frame-pointer')
            flags+=('-DCMAKE_EXE_LINKER_FLAGS_DEBUG=-fsanitize=address,undefined')
          fi
          cmake -S . -B build-review \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} \
            -DMUDUO_BUILD_EXAMPLES=ON "${flags[@]}"
      - name: Build libraries and tests
        working-directory: source
        run: |
          targets=(muduo_net logstream_test)
          if [ -f muduo/base/tests/AsyncLogging_unittest.cc ]; then
            targets+=(asynclogging_unittest)
          fi
          cmake --build build-review --parallel 2 --target "${targets[@]}"
      - name: Run regression tests
        working-directory: source
        run: ctest --test-dir build-review --output-on-failure -R '^(logstream_test|asynclogging_shutdown_.*)$'
      - name: Verify tests reject upstream and original fixes
        if: matrix.compiler == 'g++' && matrix.build_type == 'Debug'
        working-directory: source
        run: python3 ../harness/scripts/validate_logging_regressions.py '${{ matrix.revision }}'
